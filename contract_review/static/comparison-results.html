<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>对比结果</title><link rel="stylesheet" href="styles.css?v=20260814-11"></head>
<body><header class="topbar"><div class="brand"><span class="brand-logo"><img src="npa-logo.png" alt="青岛新力通"></span><span class="brand-title">合同对比与金额审核系统</span></div><nav><a href="comparison.html">合同对比</a></nav></header>
<main class="shell"><div class="page-title"><h1>对比结果列表</h1><p>查询全部合同对比记录，并打开已完成任务的差异预览。</p></div>
<section class="panel results-panel"><div class="results-toolbar"><form id="filters" class="filter-bar">
<label class="search-field"><span class="sr-only">文件名</span><input id="filename-filter" type="search" placeholder="请输入文件名"><b aria-hidden="true">⌕</b></label>
<label class="filter-field"><span>创建时间</span><input id="date-from" type="date"><em>至</em><input id="date-to" type="date"></label>
<label class="filter-field"><span>处理进度</span><select id="status-filter"><option value="">全部</option><option value="queued">等待处理</option><option value="submitting">正在提交</option><option value="processing">处理中</option><option value="completed">已完成</option><option value="failed">失败</option></select></label>
<button class="btn primary" type="submit">查询</button><button class="btn ghost" id="reset-filters" type="button">重置</button>
</form><a class="btn primary new-comparison" href="comparison.html">新建对比</a></div>
<div id="message" class="message"></div><div id="results" class="empty">正在加载…</div><div id="pagination" class="pagination"></div></section></main>
<div class="preview-modal" id="modal"><div class="preview-header"><strong>合同对比预览</strong><button class="btn ghost close" onclick="closePreview()">关闭预览</button></div><iframe id="preview"></iframe></div>
<script src="common.js?v=20260814-1"></script><script src="comparison-results.js?v=20260814-1"></script></body></html>
