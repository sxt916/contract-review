<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>合同对比</title><link rel="stylesheet" href="styles.css?v=20260814-3"></head>
<body><header class="topbar"><a class="brand" href="./">合同对比与金额审核系统</a><nav><a href="comparison.html">合同对比</a><a href="amount-review.html">金额审核</a></nav></header>
<main class="shell"><div class="page-title"><h1>合同对比</h1><p>先自动配对，再确认提交。开发环境使用 TextIn 模拟适配器。</p></div><section class="panel"><h2>选择文件</h2><div class="upload-grid">
<div class="dropzone" id="word-zone"><strong>定稿 Word 合同</strong><span class="hint">选择多份文件、文件夹或拖拽上传</span><input id="words" type="file" accept=".docx" multiple><label class="btn secondary folder-button" onclick="event.stopPropagation()">选择文件夹<input id="word-folder" type="file" accept=".docx" multiple webkitdirectory></label><div class="file-list" id="word-list"></div></div>
<div class="dropzone" id="pdf-zone"><strong>盖章扫描 PDF</strong><span class="hint">选择多份文件、文件夹或拖拽上传</span><input id="pdfs" type="file" accept=".pdf" multiple><label class="btn secondary folder-button" onclick="event.stopPropagation()">选择文件夹<input id="pdf-folder" type="file" accept=".pdf" multiple webkitdirectory></label><div class="file-list" id="pdf-list"></div></div>
</div><div class="ignore-options"><div class="option-heading"><strong>忽略选项</strong><span>选择不参与差异判断的内容</span></div><div class="switch-grid">
<label class="switch-item"><input type="checkbox" data-ignore="comments"><i></i><span><strong>批注</strong><small>忽略文档批注</small></span></label>
<label class="switch-item"><input type="checkbox" data-ignore="headerfooter" checked><i></i><span><strong>页眉页脚</strong><small>包含页码</small></span></label>
<label class="switch-item"><input type="checkbox" data-ignore="stamp"><i></i><span><strong>印章</strong><small>忽略盖章图像</small></span></label>
<label class="switch-item"><input type="checkbox" data-ignore="symbols" checked><i></i><span><strong>标点符号</strong><small>忽略标点差异</small></span></label>
<label class="switch-item"><input type="checkbox" data-ignore="watermark" checked><i></i><span><strong>水印</strong><small>忽略页面水印</small></span></label>
</div></div><div id="message" class="message"></div><div class="actions"><button class="btn secondary" id="pair" disabled>生成配对清单</button></div><div id="pairs" class="pair-list"></div></section><section class="panel"><div class="section-heading"><div><h2>本次对比任务</h2><p>仅显示本次提交的文件，全部历史记录请前往对比结果。</p></div><a class="text-link" href="comparison-results.html">查看全部结果 →</a></div><div id="history" class="empty">本次尚未提交对比任务</div></section></main><div class="preview-modal" id="modal"><button class="btn danger close" onclick="closePreview()">关闭预览</button><iframe id="preview"></iframe></div><script src="common.js?v=20260814-1"></script><script src="comparison.js?v=20260814-1"></script></body></html>
