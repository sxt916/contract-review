<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>金额审核</title><link rel="stylesheet" href="styles.css?v=20260825-3"></head>
<body><header class="topbar"><div class="brand"><span class="brand-logo"><img src="npa-logo.png" alt="青岛新力通"></span><span class="brand-title">合同对比与金额审核系统</span></div><nav><a href="comparison.html">合同对比</a><a href="amount-review.html">金额审核</a><a href="contract-check.html">对比与审核</a></nav></header>
<main class="shell"><div class="page-title"><h1>金额审核</h1><p>文件仅在内网服务器解析，完成后立即删除原 Word。</p></div>
<section class="panel"><h2>上传合同</h2><div class="dropzone" id="zone"><strong>拖拽或选择 Word 合同</strong><span class="hint">支持 .docx，一次最多 10 份，单份不超过 20 MB</span><div class="picker-actions"><label class="btn secondary" for="files" onclick="event.stopPropagation()">选择文件</label><label class="btn secondary" for="folder" onclick="event.stopPropagation()">选择文件夹</label></div><input id="files" type="file" accept=".docx" multiple><input id="folder" type="file" accept=".docx" multiple webkitdirectory directory><div class="file-list" id="selected"></div></div><div id="message" class="message"></div><div class="actions"><button class="btn primary" id="upload" disabled>开始审核</button></div></section>
<section class="panel"><div class="section-heading"><div><h2>本次审核任务</h2><p>仅显示本次提交的合同，全部历史记录请前往审核结果列表。</p></div><a class="text-link" href="amount-review-results.html">查看全部审核记录 →</a></div><div id="list" class="empty">本次尚未提交审核任务</div></section></main><script src="common.js?v=20260827-1"></script><script src="amount-review.js?v=20260825-3"></script></body></html>
