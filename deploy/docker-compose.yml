services:
  contract-review-web:
    build:
      context: ..
    image: contract-review:latest
    container_name: contract-review-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_DIR: /data
    volumes:
      - contract-review-data:/data
    networks:
      - nuwa-net

  contract-review-worker:
    image: contract-review:latest
    container_name: contract-review-worker
    restart: unless-stopped
    depends_on:
      - contract-review-web
    env_file:
      - .env
    environment:
      DATA_DIR: /data
    command: ["python", "-m", "contract_review.worker"]
    volumes:
      - contract-review-data:/data
    networks:
      - nuwa-net

volumes:
  contract-review-data:

networks:
  nuwa-net:
    external: true
