[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contract-review"
version = "0.1.0"
description = "Internal contract comparison and amount review service"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.9,<1",
  "httpx>=0.27,<1",
  "pypdf>=4,<7",
  "pydantic-settings>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1"]

[project.scripts]
contract-review-web = "contract_review.main:run"
contract-review-worker = "contract_review.worker:run"

[tool.setuptools.packages.find]
include = ["contract_review*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

